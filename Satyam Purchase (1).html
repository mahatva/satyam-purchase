<script>
// ---------- sample masters (example values from the spec) ----------
const TODAY = new Date(2026,9,15,10,30);
const YYMMDD = d => String(d.getFullYear()).slice(2)+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');
const M = {
  centres:[
    {code:'DWL',name:'Diwal',shortage:0.005,profitOverride:null},
    {code:'SC2',name:'Sample centre 2',shortage:0.005,profitOverride:null},
    {code:'SC3',name:'Sample centre 3',shortage:0.004,profitOverride:80},
    {code:'SC4',name:'Sample centre 4',shortage:0.005,profitOverride:null},
    {code:'SC5',name:'Sample centre 5',shortage:0.006,profitOverride:null},
  ],
  commodities:{Maize:'मक्का',Chickpea:'चना'},
  profit:100,
  prices:[ // full history, never edited
    {c:'Maize',g:'A',v:2550,at:'2026-10-15 09:00'},{c:'Maize',g:'B',v:2450,at:'2026-10-15 09:00'},{c:'Maize',g:'C',v:2350,at:'2026-10-15 09:00'},
    {c:'Chickpea',g:'A',v:6100,at:'2026-10-15 09:00'},{c:'Chickpea',g:'B',v:5950,at:'2026-10-15 09:00'},{c:'Chickpea',g:'C',v:5800,at:'2026-10-15 09:00'},
    {c:'Maize',g:'A',v:2520,at:'2026-10-14 09:00'},
  ],
  expenses:{
    DWL:[
      {n:'Mandi fee',t:'pct',v:1.7},{n:'Local hammali',t:'fix',v:20},{n:'Local transit',t:'fix',v:20},
      {n:'Loading labour',t:'fix',v:33},{n:'Commission',t:'pct',v:3},{n:'Bags',t:'fix',v:40},{n:'Freight to plant',t:'fix',vg:{A:90,B:85,C:80}}],
  },
  moisture:{ // per commodity (same for A/B/C in this sample)
    Maize:{base:14,dedType:'wt',ded:1,max:18},
    Chickpea:{base:12,dedType:'rs',ded:30,max:14},
  },
};
['SC2','SC3','SC4','SC5'].forEach((c,i)=>M.expenses[c]=M.expenses.DWL.map(e=>e.vg?{...e,vg:Object.fromEntries(Object.entries(e.vg).map(([g,v])=>[g,v+[20,-15,40,5][i]]))}:{...e}));

// ---------- calculations ----------
function plantPrice(c,g){return M.prices.filter(p=>p.c===c&&p.g===g).sort((a,b)=>b.at.localeCompare(a.at))[0].v}
function profitFor(code){const ce=M.centres.find(x=>x.code===code);return ce.profitOverride??M.profit}
// daily allowed qty (qtl) per centre + commodity + date; today and next 3 days
const ISO=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const DAYS=[0,1,2,3].map(i=>{const d=new Date(TODAY);d.setDate(d.getDate()+i);return {iso:ISO(d),label:i===0?'Today':i===1?'Tomorrow':d.toLocaleDateString('en-IN',{day:'numeric',month:'short'})}});
M.limits={};
[['DWL',[150,200,200,120]],['SC2',[100,100,80,80]],['SC3',[60,60,60,60]]].forEach(([c,a])=>a.forEach((v,i)=>M.limits[c+'|Maize|'+DAYS[i].iso]=v));
M.limits['DWL|Chickpea|'+DAYS[0].iso]=40;
function limitFor(code,c,iso){const v=M.limits[code+'|'+c+'|'+iso];return v==null||v===''?null:+v}
function booked(code,c,iso){const a=sodas.filter(s=>s.centre===code&&s.c===c&&s.at===iso&&s.status!=='Cancelled');return {qty:a.reduce((x,s)=>x+s.qty,0),pend:a.filter(s=>s.status==='PendingApproval').reduce((x,s)=>x+s.qty,0)}}
function reasonsOf(s){return s.reasons||(s.snap.agreed>s.snap.ceiling?['ceiling']:[])}
function commDefault(code){return M.expenses[code].find(e=>e.n==='Commission').v}
function calc(code,c,g,moist,comm){
  const cd=commDefault(code), cv=(comm===''||comm==null||isNaN(+comm))?cd:Math.min(Math.max(+comm,0),cd);
  const plant=plantPrice(c,g), profit=profitFor(code), T=plant-profit;
  const ex=M.expenses[code].map(e=>e.n==='Commission'?{n:e.n,t:e.t,v:cv,def:cd,reduced:cv<cd}:{n:e.n,t:e.t,v:e.vg?e.vg[g]:e.v,byGrade:!!e.vg}), ce=M.centres.find(x=>x.code===code);
  const Pct=ex.filter(e=>e.t==='pct').reduce((s,e)=>s+e.v/100,0);
  const Fix=ex.filter(e=>e.t==='fix').reduce((s,e)=>s+e.v,0);
  const S=ce.shortage;
  const P=(T*(1-S)-Fix)/(1+Pct);
  const mr=M.moisture[c]; const excess=Math.max(0,moist-mr.base);
  const blocked=moist>mr.max;
  const mDed = mr.dedType==='wt' ? P*(mr.ded*excess/100) : mr.ded*excess;
  return {plant,profit,T,Pct,Fix,S,P,excess,mDed,ceiling:P-mDed,blocked,mr,ex,comm:cv,commDef:cd};
}
const r0=n=>Math.round(n), inr=n=>'₹'+r0(n).toLocaleString('en-IN'), q=n=>(+n).toLocaleString('en-IN',{maximumFractionDigits:2});

// ---------- state ----------
const ROLES={Admin:'Admin / Purchase Head',Officer:'Field Officer',Warehouse:'Warehouse In-charge',Accounts:'Accounts'};
let USERS=[
 {id:1,name:'Avi Mangal',mobile:'9000000001',role:'Admin',centre:'ALL',active:true,canCutComm:true,last:'15 Oct, 21:40'},
 {id:2,name:'Rahul (sample)',mobile:'9000000002',role:'Officer',centre:'DWL',active:true,canCutComm:true,last:'15 Oct, 10:30'},
 {id:3,name:'Suresh (sample)',mobile:'9000000003',role:'Warehouse',centre:'DWL',active:true,canCutComm:false,last:'15 Oct, 15:05'},
 {id:4,name:'Accounts (sample)',mobile:'9000000004',role:'Accounts',centre:'ALL',active:true,canCutComm:false,last:'14 Oct, 18:12'},
 {id:5,name:'Sample officer SC2',mobile:'9000000005',role:'Officer',centre:'SC2',active:true,canCutComm:false,last:'15 Oct, 09:20'},
 {id:6,name:'Old officer (sample)',mobile:'9000000006',role:'Officer',centre:'DWL',active:false,canCutComm:false,last:'2 Oct, 11:00'},
];
let ME=null;
const CC=()=>ME&&ME.centre!=='ALL'?ME.centre:'DWL';
const CN=()=>M.centres.find(c=>c.code===CC()).name;
const centreName=c=>c==='ALL'?'All centres':(M.centres.find(x=>x.code===c)||{}).name||c;
const meLabel=()=>ME?`${ME.name} · ${ROLES[ME.role]}`:'—';
const now=()=>new Date().toLocaleString('en-IN',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
let st={role:null,auth:{step:'phone',mobile:'',otp:'',code:'',err:''},uf:{},tab:{Officer:'new',Admin:'approve',Warehouse:'unload',Accounts:'dash'},hist:{status:'ALL',q:'',date:'ALL'},modal:null,
  fo:{c:'Maize',g:'A',m:14,comm:'',showBd:false,price:'',name:'',mob:'',vill:'',qty:'',photos:[]},
  wh:{sel:null,m:'',gross:'',tare:'',fm:'',photos:[],slip:null,search:''},
  dp:{veh:'',plant:'Plant – Pithampur',g:'A',qty:'',actual:''},
  dash:{centre:'ALL',comm:'ALL'},
  bd:{centre:'DWL',c:'Maize',g:'A',m:14}};
let sodas=[], dispatches=[], log=[];
function snap(code,c,g,m,price,comm){const k=calc(code,c,g,m,comm);return {commission:k.comm,commDefault:k.commDef,plant:k.plant,profit:k.profit,expenses:k.ex.map(e=>({...e})),shortage:k.S,moistEntered:m,baseCeil:k.P,ceiling:k.ceiling,agreed:price}}
function samplePhoto(label,h1,h2,kind){
  try{const c=document.createElement('canvas');c.width=640;c.height=480;const x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,640,480);g.addColorStop(0,h1);g.addColorStop(1,h2);x.fillStyle=g;x.fillRect(0,0,640,480);

}

  const b=e.target.closest('[data-a]'); if(!b||b.tagName==='INPUT'||b.tagName==='SELECT') return;
  const a=b.dataset.a, v=b.dataset.v;
  if(a==='closeViewer'){if(e.target.id==='v-img')return;document.getElementById('viewer').hidden=true;return}
  if(a==='vPrev'){showImg(st.vi-1);return} if(a==='vNext'){showImg(st.vi+1);return}
  if(a==='img'){showImg(+v);return}
  if(a==='closeModal'){if(b.id==='modal'&&e.target!==b)return;closeModal();return}
  if(a==='open'){openModal(v);return}
  if(a==='histSt'){st.hist.status=v;render();return}
  if(a==='fillMob'){st.auth.mobile=v;st.auth.err='';render();return}
  if(a==='sendOtp'){const m=(st.auth.mobile||'').replace(/\D/g,'');const u=USERS.find(x=>x.mobile===m);
    st.auth.err=m.length!==10?'Enter a 10-digit mobile number.':!u?'This number is not registered. Ask Admin to add you.':!u.active?'This user is deactivated. Contact Admin.':'';
    if(!st.auth.err){st.auth={...st.auth,mobile:m,step:'otp',otp:'',code:String(Math.floor(100000+Math.random()*900000))}}render();return}
  if(a==='changeMob'){st.auth={step:'phone',mobile:st.auth.mobile,otp:'',code:'',err:''};render();return}
  if(a==='verifyOtp'){if(st.auth.otp!==st.auth.code){st.auth.err='Wrong OTP. Check the code and try again.';render();return}
    ME=USERS.find(x=>x.mobile===st.auth.mobile);ME.last=now();st.role=ME.role;st.auth={step:'phone',mobile:'',otp:'',code:'',err:''};audit('Logged in');render();window.scrollTo(0,0);return}
  if(a==='logout'){audit('Logged out');ME=null;st.role=null;closeModal();render();return}
  if(a==='addUser'){openSheet('user:new',userForm(null));return}
  if(a==='editUser'){openSheet('user:'+v,userForm(USERS.find(u=>u.id===+v)));return}
  if(a==='saveUser'){const f=st.uf,m=(f.mobile||'').replace(/\D/g,''),dup=USERS.find(u=>u.mobile===m&&u.id!==+v);
    const err=!f.name.trim()?'Enter the full name.':m.length!==10?'Enter a 10-digit mobile number.':dup?`This number already belongs to ${dup.name}.`:'';
    if(err){document.getElementById('uf-err').innerHTML=`<div class="alert bad">${err}</div>`;return}
    const centre=['Admin','Accounts'].includes(f.role)?'ALL':(f.centre==='ALL'?'DWL':f.centre);
    const rec={name:f.name.trim(),mobile:m,role:f.role,centre,canCutComm:f.role==='Officer'?!!f.canCutComm:false};
    if(v){Object.assign(USERS.find(u=>u.id===+v),rec);audit(`Updated user ${rec.name} (${ROLES[rec.role]}, ${centreName(centre)})`)}
    else{USERS.push({id:Date.now(),active:true,last:null,...rec});audit(`Added user ${rec.name} (${ROLES[rec.role]}, ${centreName(centre)})`)}
    closeModal();render();toast(v?'User updated':'User added · can log in with OTP');return}
  if(a==='toggleUser'){const u=USERS.find(x=>x.id===+v);u.active=!u.active;audit(`${u.active?'Reactivated':'Deactivated'} user ${u.name}`);closeModal();render();toast(u.active?'User reactivated':'User deactivated');return}
  if(a==='tab'){st.tab[st.role]=v;render();return}
  if(a==='grade'){st.fo.g=v;render();return}
  if(a==='toggleBd'){st.fo.showBd=!st.fo.showBd;render();return}
  if(a==='dpGrade'){st.dp.g=v;render();return}
  if(a==='pick'){st.wh={...st.wh,sel:v,m:'',gross:'',tare:'',fm:'',photos:[],slip:null};render();return}
  if(a==='createSoda'){
    const f=st.fo,k=calc(CC(),f.c,f.g,+f.m,f.comm), n=sodas.filter(s=>s.id.startsWith(CC()+'-'+YYMMDD(TODAY))).length+1;
    const lim=limitFor(CC(),f.c,DAYS[0].iso), overLim=lim!=null&&booked(CC(),f.c,DAYS[0].iso).qty+(+f.qty)>lim;
    const id=`${CC()}-${YYMMDD(TODAY)}-${String(n).padStart(3,'0')}`, overC=+f.price>k.ceiling, over=overC||overLim, reasons=[...(overC?['ceiling']:[]),...(overLim?['limit']:[])];
    sodas.push({id,centre:CC(),c:f.c,g:f.g,farmer:f.name,mobile:f.mob,village:f.vill||'—',qty:+f.qty,status:over?'PendingApproval':'Confirmed',reasons,at:'2026-10-15',snap:snap(CC(),f.c,f.g,+f.m,+f.price,f.comm),photos:f.photos,photoAt:new Date().toLocaleString('en-IN',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})});
    hist(sodas[sodas.length-1],'Soda created'+(over?' · sent for approval ('+[overC?'over ceiling':'',overLim?'over daily qty limit':''].filter(Boolean).join(', ')+')':''));
    audit(`Created soda ${id} @ ₹${f.price}${overC?' (over ceiling)':''}${overLim?' (over daily qty limit)':''}${k.comm<k.commDef?` · commission cut to ${k.comm}%`:''}`);
    const msg=encodeURIComponent(`Satyam Agrocot – Soda ${id}\n${f.c} Grade ${f.g}, approx ${f.qty} qtl @ ₹${f.price}/qtl\nMoisture ${f.m}%`);
    st.fo={...st.fo,price:'',name:'',mob:'',vill:'',qty:'',photos:[]};render();
    const card=document.createElement('div');card.className='card';card.innerHTML=`<h2>Soda ${id} ${over?'sent for approval':'confirmed'}</h2><a class="btn sec" style="text-align:center;text-decoration:none" target="_blank" rel="noopener" href="https://wa.me/${f.mob?'91'+f.mob:''}?text=${msg}">Share on WhatsApp</a>`;
    app.prepend(card);window.scrollTo(0,0);return}
  if(a==='unload'){const s=sodas.find(x=>x.id===st.wh.sel),w=st.wh;s.net=(+w.gross)-(+w.tare);s.fm=+w.fm||+w.m;s.um=+w.m;s.gross=+w.gross;s.tare=+w.tare;s.unloadPhotos=w.photos;s.slip=w.slip;s.slipImg=w.slipImg;s.status='Unloaded';hist(s,`Unloaded · net ${q(s.net)} qtl, final moisture ${s.fm}%`);
    audit(`Unloaded ${s.id}: net ${q(s.net)} qtl, moisture ${s.fm}%`);st.wh={sel:null,m:'',gross:'',tare:'',fm:'',photos:[],slip:null,search:''};render();toast('Unload confirmed · sent to Admin');return}
  if(a==='dispatch'){const d=st.dp,fr=M.expenses[CC()].find(e=>e.n==='Freight to plant').vg[d.g],n=dispatches.length+1;
    dispatches.push({id:'DSP-'+n,centre:CC(),date:'2026-10-15',g:d.g,veh:d.veh,plant:d.plant,qty:+d.qty,est:+d.qty*fr,actual:+d.actual});
    audit(`Dispatch ${q(d.qty)} qtl on ${d.veh}`);st.dp={veh:'',plant:d.plant,g:d.g,qty:'',actual:''};render();toast('Dispatch saved');return}
  if(a==='approveOver'){const s=sodas.find(x=>x.id===v);s.status='Confirmed';hist(s,'Approved by Admin @ ₹'+s.snap.agreed);if(st.modal)closeModal();audit(`Approved over-ceiling ${v} @ ₹${s.snap.agreed}`);render();toast('Approved');return}
  if(a==='cancel'){const s=sodas.find(x=>x.id===v);s.status='Cancelled';s.reason=reasonsOf(s).map(r=>r==='ceiling'?'Rate above ceiling':'Over daily qty limit').join(', ')||'Cancelled by Admin';hist(s,'Cancelled · '+s.reason);if(st.modal)closeModal();audit(`Cancelled ${v}: rate above ceiling`);render();toast('Soda cancelled');return}
  if(a==='approveFinal'){const s=sodas.find(x=>x.id===v),fc=finalCalc(s,s.fm,s.net);s.finalRate=r0(fc.rate);s.amount=fc.amount;s.status='FinalApproved';hist(s,'Final rate approved @ ₹'+s.finalRate.toLocaleString('en-IN'));if(st.modal)closeModal();audit(`Final approved ${v} @ ₹${s.finalRate}`);render();toast('Final rate approved');return}
  if(a==='savePrices'){let n=0;document.querySelectorAll('[id^="np-"]').forEach(i=>{if(+i.value>0){M.prices.push({c:i.dataset.c,g:i.dataset.g,v:+i.value,at:'2026-10-15 '+new Date().toTimeString().slice(0,5)});n++}});
    if(n){audit(`Published ${n} new plant price(s)`);render();toast(`${n} price(s) published`)}else toast('Enter a new price first');return}
  if(a==='csv'){const ta=document.getElementById('csv-out');const rows=[['Soda','Status','Centre','Commodity','Grade','Farmer','Village','Qty','Agreed','Ceiling','FinalRate']].concat(sodas.map(s=>[s.id,s.status,s.centre,s.c,s.g,s.farmer,s.village,s.net||s.qty,s.snap.agreed,r0(s.snap.ceiling),s.finalRate||'']));
    ta.value=rows.map(r=>r.map(x=>`"${String(x).replace(/"/g,'""')}"`).join(',')).join('\n');ta.hidden=false;
    navigator.clipboard?.writeText(ta.value).then(()=>toast('CSV copied — paste into Excel'),()=>{ta.select();toast('Select all and copy')}) ?? (ta.select());return}
});
let refocus=null;
document.addEventListener('input',e=>{
  const t=e.target,a=t.dataset.a; if(!a) return;
  if(['fo','wh','dp','bd','dash','hist'].includes(a)){st[a][t.dataset.k]=t.value}
  else if(a==='ex'){const e=M.expenses.DWL[+t.dataset.i];if(t.dataset.g)e.vg[t.dataset.g]=+t.value;else e.v=+t.value;audit(`Changed Diwal ${e.n}${t.dataset.g?' (Grade '+t.dataset.g+')':''} to ${t.value}`);return}
  else if(a==='profit'){M.profit=+t.value;return}
  else if(a==='auth'){st.auth[t.dataset.k]=t.value.replace(/\D/g,'');if(t.value!==st.auth[t.dataset.k])t.value=st.auth[t.dataset.k];return}
  else if(a==='uf'){st.uf[t.dataset.k]=t.value;return}
  else if(a==='ufc'){st.uf[t.dataset.k]=t.checked;return}
  else if(a==='uq'){st.uq=t.value;const id=t.id,pos=t.selectionStart;render();const n=document.getElementById(id);if(n){n.focus();n.setSelectionRange(pos,pos)}return}
  else if(a==='lim'){M.limits[t.dataset.key]=t.value===''?null:+t.value;return}
  else if(a==='limC'){st.limC=t.value;render();return}
  else if(a==='short'){M.centres[0].shortage=(+t.value)/100;return}
  else return;
  if(t.tagName==='SELECT'){render();return}
  // keep typing focus across re-render
  const id=t.id,pos=t.selectionStart;render();const n=document.getElementById(id);if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(_){}}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.a==='photo'){const tgt=st[t.dataset.k];[...t.files].slice(0,4).forEach(f=>{const r=new FileReader();r.onload=()=>{tgt.photos.push(r.result);render()};r.readAsDataURL(f)})}
  if(t.dataset.a==='slip'&&t.files[0]){const f=t.files[0];st.wh.slip=f.name;st.wh.slipImg=null;if(f.type.startsWith('image/')){const r=new FileReader();r.onload=()=>{st.wh.slipImg=r.result;render()};r.readAsDataURL(f)}else render()}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(!document.getElementById('viewer').hidden){document.getElementById('viewer').hidden=true}else if(st.modal)closeModal()}
  if(e.key==='Enter'&&(e.target.matches('tr[data-a="open"]')||e.target.matches('img[data-a="img"]')))e.target.click();
  if(!document.getElementById('viewer').hidden){if(e.key==='ArrowLeft')showImg(st.vi-1);if(e.key==='ArrowRight')showImg(st.vi+1)}
});
render();
</script>
